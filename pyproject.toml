[project]
name = "bat-autobidding-benchmark"
version = "0.1.0"
requires-python = ">=3.10"
description = "Benchmark for auto-bidding strategies in ad auctions"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "utils"]

[tool.setuptools.packages.find]
include = ["simulator*", "example_notebooks*"]
